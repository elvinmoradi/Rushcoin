<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RushCoins | راش کوینز</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&family=Estedad:wght@500;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#07070c; --bg2:#0f0f17; --panel:rgba(255,255,255,.045); --panel-b:rgba(255,255,255,.09);
  --gold:#f0b429; --gold2:#ffd76a; --gold3:#c9860a; --gold-dim:#8a6a1f; --violet:#8b7bff;
  --txt:#f5f3ee; --sub:#94919f; --ok:#39d98a; --err:#ff5d6c; --warn:#ffb545;
  --r:20px; --r-sm:14px;
  --shadow-gold: 0 0 30px rgba(240,180,41,.22);
  --ease: cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box; margin:0; padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Vazirmatn',sans-serif; background:
    radial-gradient(1100px 560px at 12% -12%, rgba(240,180,41,.11), transparent 58%),
    radial-gradient(900px 520px at 112% 8%, rgba(139,123,255,.09), transparent 55%),
    radial-gradient(700px 500px at 50% 120%, rgba(240,180,41,.06), transparent 60%),
    var(--bg);
  color:var(--txt); min-height:100vh; padding-bottom:88px; -webkit-font-smoothing:antialiased;
}
a{color:inherit; text-decoration:none}
button{font-family:inherit; cursor:pointer; border:none; transition:transform .15s var(--ease), box-shadow .15s var(--ease), opacity .15s}
button:active{transform:scale(.96)}
::selection{background:var(--gold); color:#161200}
::-webkit-scrollbar{width:6px} ::-webkit-scrollbar-thumb{background:var(--gold-dim); border-radius:8px}

#app{animation:pageIn .35s var(--ease)}
@keyframes pageIn{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:translateY(0)}}

/* ---------- layout shells ---------- */
.topbar{
  position:sticky; top:0; z-index:40; display:flex; align-items:center; justify-content:space-between;
  padding:14px 18px; backdrop-filter:blur(18px); background:rgba(7,7,12,.72); border-bottom:1px solid var(--panel-b);
}
.brand{display:flex; align-items:center; gap:8px; font-weight:800; font-size:19px; letter-spacing:.2px; font-family:'Estedad',sans-serif}
.brand .mark{
  width:34px; height:34px; border-radius:11px; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(145deg,var(--gold2),var(--gold3)); font-size:17px; box-shadow:var(--shadow-gold);
}
.brand b{
  background:linear-gradient(90deg,var(--gold2),var(--gold),var(--gold2)); background-size:200% auto;
  -webkit-background-clip:text; background-clip:text; color:transparent; animation:shine 4s linear infinite;
}
@keyframes shine{to{background-position:-200% center}}
.top-actions{display:flex; align-items:center; gap:10px}
.chip{display:flex; align-items:center; gap:6px; background:var(--panel); border:1px solid var(--panel-b); padding:7px 13px; border-radius:100px; font-size:13px}
.chip b{color:var(--gold2)}

main{max-width:520px; margin:0 auto; padding:18px 16px 24px}
@media(min-width:720px){ main{max-width:760px} }

.section-title{display:flex; align-items:center; justify-content:space-between; margin:28px 0 13px}
.section-title h2{font-size:17px; font-weight:800; font-family:'Estedad',sans-serif}
.section-title span{font-size:12.5px; color:var(--sub)}

/* ---------- cards ---------- */
.card{
  background:linear-gradient(155deg, rgba(255,255,255,.05), rgba(255,255,255,.015)); border:1px solid var(--panel-b);
  border-radius:var(--r); padding:16px; backdrop-filter:blur(12px); transition:border-color .2s var(--ease), transform .2s var(--ease);
}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.grid4{display:grid; grid-template-columns:repeat(2,1fr); gap:10px}
@media(min-width:560px){ .grid4{grid-template-columns:repeat(4,1fr)} }

.feature-card{
  padding:19px 14px; text-align:center; border-radius:var(--r-sm);
  background:linear-gradient(155deg, rgba(255,255,255,.05), rgba(255,255,255,.015)); border:1px solid var(--panel-b);
  transition:transform .18s var(--ease), border-color .18s var(--ease), box-shadow .18s var(--ease);
}
.feature-card:active{transform:scale(.96)}
.feature-card:hover{border-color:rgba(240,180,41,.35); box-shadow:0 10px 26px rgba(240,180,41,.08); transform:translateY(-2px)}
.feature-card .emo{font-size:27px; display:block; margin-bottom:9px; filter:drop-shadow(0 0 8px rgba(240,180,41,.25))}
.feature-card b{font-size:13.5px; display:block}
.icon-badge{width:46px; height:46px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:22px; margin:0 auto 10px}
.icon-badge.g{background:linear-gradient(145deg, rgba(240,180,41,.25), rgba(240,180,41,.06)); box-shadow:0 0 18px rgba(240,180,41,.15)}
.icon-badge.v{background:linear-gradient(145deg, rgba(139,123,255,.28), rgba(139,123,255,.06)); box-shadow:0 0 18px rgba(139,123,255,.18)}
.icon-badge.c{background:linear-gradient(145deg, rgba(58,211,211,.25), rgba(58,211,211,.06)); box-shadow:0 0 18px rgba(58,211,211,.15)}

  background-size:cover; background-position:center 30%; margin-bottom:6px}
.hero h1{
  font-size:40px; font-weight:900; letter-spacing:.5px; line-height:1.15; font-family:'Estedad',sans-serif;
  background:linear-gradient(100deg,#fff 10%, var(--gold2) 45%, var(--gold) 55%, #fff 90%); background-size:220% auto;
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 4px 20px rgba(240,180,41,.15)); animation:shine 5s linear infinite;
}
.hero p{color:var(--sub); margin-top:11px; font-size:14.5px; line-height:1.9}
.hero-actions{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:22px}

.btn{padding:12px 21px; border-radius:100px; font-weight:700; font-size:14px; display:inline-flex; align-items:center; gap:6px}
.btn-gold{background:linear-gradient(90deg,var(--gold2),var(--gold)); color:#1a1300; box-shadow:0 8px 24px rgba(240,180,41,.3)}
.btn-gold:hover{box-shadow:0 10px 30px rgba(240,180,41,.42)}
.btn-ghost{background:var(--panel); border:1px solid var(--panel-b); color:var(--txt)}
.btn-ghost:hover{border-color:rgba(240,180,41,.35)}
.btn-block{width:100%; justify-content:center}
.btn-sm{padding:8px 14px; font-size:12.5px; border-radius:100px}
.btn[disabled]{opacity:.45; pointer-events:none}

.stat-strip{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:30px}
@media(min-width:560px){ .stat-strip{grid-template-columns:repeat(4,1fr)} }
.stat-strip .card{text-align:center; padding:17px 8px}
.stat-strip .num{font-size:21px; font-weight:800; color:var(--gold2)}
.stat-strip .lbl{font-size:11.5px; color:var(--sub); margin-top:4px}

/* ---------- balance card ---------- */
.balance-card{
  background:linear-gradient(150deg, rgba(240,180,41,.18), rgba(240,180,41,.02) 60%), var(--panel);
  border:1px solid rgba(240,180,41,.38); border-radius:24px; padding:23px; position:relative; overflow:hidden;
  box-shadow:0 20px 50px rgba(240,180,41,.06);
}
.balance-card::before{content:''; position:absolute; width:200px; height:200px; border-radius:50%; background:radial-gradient(circle,rgba(240,180,41,.16),transparent 70%); top:-90px; left:-70px; pointer-events:none}
.balance-card .lbl{font-size:12.5px; color:var(--sub)}
.balance-card .amount{font-size:38px; font-weight:900; margin-top:6px; display:flex; align-items:center; gap:8px}
.balance-card .amount .coin{font-size:27px; filter:drop-shadow(0 0 10px rgba(240,180,41,.5))}
.balance-card .row{display:flex; justify-content:space-between; margin-top:16px; font-size:12.5px; color:var(--sub)}
.progress{height:6px; background:rgba(255,255,255,.08); border-radius:100px; margin-top:8px; overflow:hidden}
.progress i{display:block; height:100%; background:linear-gradient(90deg,var(--gold2),var(--gold)); transition:width .5s var(--ease); box-shadow:0 0 8px rgba(240,180,41,.5)}

.mini-stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px}
.mini-stats .box{background:rgba(255,255,255,.04); border:1px solid var(--panel-b); border-radius:13px; padding:11px 6px; text-align:center; transition:transform .15s var(--ease)}
.mini-stats .box:hover{transform:translateY(-2px)}
.mini-stats .box b{display:block; font-size:15px; color:var(--gold2)}
.mini-stats .box span{font-size:10.5px; color:var(--sub)}

/* ---------- challenge / list items ---------- */
.item{
  display:flex; align-items:center; gap:12px; padding:14px; border-radius:17px;
  background:linear-gradient(155deg, rgba(255,255,255,.045), rgba(255,255,255,.012)); border:1px solid var(--panel-b); margin-bottom:10px;
  transition:border-color .18s var(--ease), transform .18s var(--ease);
}
.item:hover{border-color:rgba(240,180,41,.25); transform:translateX(-2px)}
.item .ico{width:43px; height:43px; border-radius:13px; background:rgba(240,180,41,.13); display:flex; align-items:center; justify-content:center; font-size:19px; flex-shrink:0}
.item .body{flex:1; min-width:0}
.item .title{font-weight:700; font-size:14px}
.item .desc{color:var(--sub); font-size:12px; margin-top:3px}
.item .reward{color:var(--gold2); font-size:12px; margin-top:4px; font-weight:700}
.badge{font-size:10.5px; padding:3px 9px; border-radius:100px; font-weight:700}
.badge-ok{background:rgba(57,217,138,.15); color:var(--ok)}
.badge-warn{background:rgba(255,181,69,.15); color:var(--warn)}
.badge-live{background:rgba(57,217,138,.15); color:var(--ok)}
.badge-soon{background:rgba(255,181,69,.15); color:var(--warn)}
.badge-end{background:rgba(255,93,108,.15); color:var(--err)}

/* ---------- vip ---------- */
.vip-hero{
  text-align:center; padding:32px 16px; border-radius:26px; margin-bottom:18px; position:relative; overflow:hidden;
  background:linear-gradient(160deg, rgba(240,180,41,.2), rgba(20,16,4,.45)); border:1px solid rgba(240,180,41,.42);
  box-shadow:0 20px 50px rgba(240,180,41,.08);
}
.vip-hero .crown{font-size:40px; filter:drop-shadow(0 0 14px rgba(240,180,41,.5))}
.vip-hero h2{font-size:22px; font-weight:900; margin-top:9px; font-family:'Estedad',sans-serif}
.vip-hero p{color:var(--sub); font-size:13px; margin-top:6px}
.plan-card{
  border-radius:19px; padding:18px; border:1px solid var(--panel-b);
  background:linear-gradient(155deg, rgba(255,255,255,.05), rgba(255,255,255,.015)); margin-bottom:12px;
  display:flex; align-items:center; justify-content:space-between; gap:10px; transition:transform .18s var(--ease), border-color .18s var(--ease);
}
.plan-card:hover{transform:translateY(-2px)}
.plan-card.featured{border-color:var(--gold); box-shadow:var(--shadow-gold)}
.plan-card .name{font-weight:800; font-size:15px}
.plan-card .perk{color:var(--sub); font-size:11.5px; margin-top:4px}
.plan-card .price{font-weight:800; color:var(--gold2); font-size:15px; white-space:nowrap}

/* ---------- forms/modals ---------- */
.field{margin-bottom:14px}
.field label{font-size:12.5px; color:var(--sub); display:block; margin-bottom:6px}
.field input, .field textarea, .field select{
  width:100%; background:rgba(255,255,255,.05); border:1px solid var(--panel-b); border-radius:13px;
  padding:12px 14px; color:var(--txt); font-family:inherit; font-size:14px; transition:border-color .15s;
}
.field input:focus, .field textarea:focus{outline:none; border-color:var(--gold)}

.overlay{position:fixed; inset:0; background:rgba(4,4,7,.76); backdrop-filter:blur(5px); z-index:100; display:flex; align-items:flex-end; justify-content:center; animation:fadeIn .18s}
@keyframes fadeIn{from{opacity:0} to{opacity:1}}
.sheet{width:100%; max-width:520px; background:linear-gradient(165deg,#14121b,#0d0c12); border:1px solid var(--panel-b); border-radius:24px 24px 0 0; padding:20px; max-height:88vh; overflow:auto; animation:up .28s var(--ease); box-shadow:0 -20px 60px rgba(0,0,0,.5)}
@media(min-width:560px){ .overlay{align-items:center} .sheet{border-radius:24px} }
@keyframes up{from{transform:translateY(30px); opacity:0} to{transform:translateY(0); opacity:1}}
.sheet-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px}
.sheet-head h3{font-size:16px; font-weight:800}
.close-x{width:32px; height:32px; border-radius:100px; background:var(--panel); display:flex; align-items:center; justify-content:center; font-size:16px; transition:background .15s}
.close-x:hover{background:rgba(255,93,108,.15)}

/* ---------- bottom nav ---------- */
.bottom-nav{
  position:fixed; bottom:0; inset-inline:0; z-index:50; display:flex; justify-content:space-around;
  background:rgba(9,9,14,.85); backdrop-filter:blur(20px); border-top:1px solid var(--panel-b); padding:9px 4px 12px;
}
.nav-item{display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10.5px; color:var(--sub); padding:5px 14px; border-radius:14px; transition:color .15s, background .15s}
.nav-item .ic{font-size:19px; transition:transform .15s var(--ease)}
.nav-item.active{color:var(--gold2); background:rgba(240,180,41,.1)}
.nav-item.active .ic{transform:translateY(-2px) scale(1.05)}

/* ---------- toast/loading/empty ---------- */
.toast-wrap{position:fixed; top:14px; inset-inline:0; z-index:200; display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none}
.toast{
  background:#16141c; border:1px solid var(--panel-b); padding:11px 18px; border-radius:100px; font-size:13px;
  box-shadow:0 10px 34px rgba(0,0,0,.45); animation:toastIn .28s var(--ease); display:flex; align-items:center; gap:8px;
}
.toast.ok{border-color:rgba(57,217,138,.4)} .toast.err{border-color:rgba(255,93,108,.4)}
@keyframes toastIn{from{transform:translateY(-16px); opacity:0} to{transform:translateY(0); opacity:1}}
.coin-fly{position:fixed; z-index:300; font-weight:800; color:var(--gold2); font-size:20px; pointer-events:none; animation:flyUp 1.2s var(--ease) forwards; text-shadow:0 0 12px rgba(240,180,41,.6)}
@keyframes flyUp{0%{transform:translateY(0) scale(1); opacity:0} 15%{opacity:1} 100%{transform:translateY(-70px) scale(1.15); opacity:0}}

.empty{text-align:center; padding:42px 14px; color:var(--sub)}
.empty .e{font-size:32px; margin-bottom:10px; display:block}
.skel{background:linear-gradient(90deg, rgba(255,255,255,.04), rgba(255,255,255,.1), rgba(255,255,255,.04)); background-size:200% 100%; animation:sh 1.3s infinite; border-radius:16px; height:64px; margin-bottom:10px}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.spin{width:16px; height:16px; border:2px solid rgba(255,255,255,.25); border-top-color:var(--gold); border-radius:50%; animation:spin .7s linear infinite; display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

.gate{min-height:70vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px}
.gate .mark-big{width:72px; height:72px; border-radius:22px; background:linear-gradient(145deg,var(--gold2),var(--gold3)); display:flex; align-items:center; justify-content:center; font-size:33px; box-shadow:var(--shadow-gold); margin-bottom:18px}

<script>
/* ============================================================
   CONFIG — replace with your Supabase anon (public) key
   ============================================================ */
const SUPABASE_URL = "https://ztmeugkmupuqletdsxtd.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_tE8d1slDONHjpBxa9Wb2Vw_eIKd_A2o";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ---------------- state ---------------- */
const state = { user:null, profile:null, challenges:[], events:[], vipPlans:[], coinPackages:[] };
function saveSession(u){ localStorage.setItem('rc_user', JSON.stringify(u)); }
function loadSession(){ try{ return JSON.parse(localStorage.getItem('rc_user')); }catch(e){ return null; } }
function clearSession(){ localStorage.removeItem('rc_user'); }

/* ---------------- toast ---------------- */
function toast(msg, type='ok'){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = (type==='ok' ? '✅ ' : '⚠️ ') + msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 2600);
}
function flyCoin(amount, fromEl){
  const rect = fromEl ? fromEl.getBoundingClientRect() : {left: window.innerWidth/2, top: window.innerHeight/2};
  const el = document.createElement('div');
  el.className = 'coin-fly';
  el.style.left = (rect.left + (rect.width||0)/2 - 20) + 'px';
  el.style.top = (rect.top||window.innerHeight/2) + 'px';
  el.textContent = '+' + amount + ' 🪙';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 1200);
}
function fmtNum(n){ return Number(n||0).toLocaleString('fa-IR'); }
function timeLeft(dateStr){
  if(!dateStr) return null;
  const diff = new Date(dateStr) - new Date();
  if(diff<=0) return null;
  const d=Math.floor(diff/86400000), h=Math.floor(diff%86400000/3600000);
  return d>0 ? `${d} روز ${h} ساعت` : `${h} ساعت`;
}

/* ---------------- routing ---------------- */
const routes = ['home','dashboard','coins','vip','events','pricing','profile'];
function nav(route){ location.hash = '#/' + route; }
window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', boot);

async function boot(){
  const saved = loadSession();
  if(saved){
    state.user = saved;
    await refreshProfile();
  }
  render();
}

async function refreshProfile(){
  if(!state.user) return;
  const { data, error } = await sb.rpc('get_profile', { p_user_id: state.user.id });
  if(error || !data || !data[0]){
    console.error('get_profile error:', error);
    toast(error?.message || 'خطا در دریافت اطلاعات پروفایل','err');
    return;
  }
  state.profile = data[0];
  if(state.profile.is_banned){ toast('حساب شما مسدود شده است','err'); logout(); }
}

function logout(){ state.user=null; state.profile=null; clearSession(); nav('home'); }

/* ---------------- render shell ---------------- */
function renderTopActions(){
  const box = document.getElementById('topActions');
  if(state.user){
    box.innerHTML = `<div class="chip">🪙 <b>${fmtNum(state.profile?.coin_balance)}</b></div>
      <button class="btn btn-ghost btn-sm" onclick="logout()">خروج</button>`;
  } else {
    box.innerHTML = `<button class="btn btn-gold btn-sm" onclick="nav('login')">ورود به پنل</button>`;
  }
}
function renderBottomNav(){
  const items = [
    {r:'home', ic:'🏠', label:'خانه'},
    {r:'coins', ic:'🪙', label:'سکه'},
    {r:'events', ic:'🎉', label:'ایونت‌ها'},
    {r:'profile', ic:'👤', label:'پروفایل'},
  ];
  const cur = location.hash.replace('#/','') || 'home';
  document.getElementById('bottomNav').innerHTML = items.map(i=>`
    <a class="nav-item ${cur===i.r?'active':''}" href="#/${i.r}"><span class="ic">${i.ic}</span>${i.label}</a>
  `).join('');
}

async function render(){
  const hash = location.hash.replace('#/','') || 'home';
  renderTopActions(); renderBottomNav();
  const app = document.getElementById('app');
  app.style.animation = 'none'; void app.offsetWidth; app.style.animation = '';
  app.innerHTML = `<div class="skel"></div><div class="skel"></div><div class="skel"></div>`;

  if(hash==='login') return renderLogin();
  if(['dashboard','coins','vip','events','pricing','profile','wheel','leaderboard','box','duel','clicker','quests'].includes(hash) && !state.user){
    return renderLogin('برای دسترسی به این بخش وارد شوید');
  }
  if(state.user) await refreshProfile();
  if(state.user && !state.profile){
    app.innerHTML = `<div class="gate">
      <div class="mark-big"></div>
      <h2 style="font-size:18px; font-weight:800; margin-bottom:6px">مشکل در بارگذاری پروفایل</h2>

      <button class="btn btn-gold" onclick="render()">تلاش دوباره</button>
    </div>`;
    return;
  }

  switch(hash){
    case 'home': return renderHome();
    case 'dashboard': return renderDashboard();
    case 'coins': return renderCoins();
    case 'vip': return renderVip();
    case 'events': return renderEvents();
    case 'pricing': return renderPricing();
    case 'profile': return renderProfile();
    case 'wheel': return renderWheel();
    case 'leaderboard': return renderLeaderboard();
    case 'box': return renderBox();
    case 'duel': return renderDuel();
    case 'clicker': return renderClicker();
    case 'quests': return renderQuests();
    default: return renderHome();
  }
}

let videoTimer = null;
async function openVideoChallenge(c){
  if(!state.user){ nav('login'); return; }
  if(state.profile?.restricted_until && new Date(state.profile.restricted_until) > new Date()){
    toast('به‌دلیل فعالیت غیرعادی، فعلاً محدود شدی','err'); return;
  }
  openSheet(`▶️ ${c.title}`, `

      <iframe src="https://www.youtube.com/embed/${c.video_id}?autoplay=1&rel=0" style="position:absolute; inset:0; width:100%; height:100%; border:0"
        allow="autoplay; encrypted-media" allowfullscreen></iframe>

    <button class="btn btn-gold btn-block" id="videoClaimBtn" disabled>در حال شروع...</button>
  `);
  const btn = document.getElementById('videoClaimBtn');
  const { data: compId, error } = await sb.rpc('start_challenge', { p_user_id: state.user.id, p_challenge_id: c.id });
  if(error){ toast(error.message,'err'); closeSheet(); return; }

  let remaining = c.wait_seconds || 0;
  if(remaining > 0){
    btn.textContent = `⏳ ${remaining} ثانیه مونده`;
    videoTimer = setInterval(()=>{
      remaining--;
      if(!document.getElementById('videoClaimBtn')){ clearInterval(videoTimer); return; }
      if(remaining <= 0){
        clearInterval(videoTimer);
        btn.disabled = false; btn.textContent = '🎁 دریافت جایزه';
      } else {
        btn.textContent = `⏳ ${remaining} ثانیه مونده`;
      }
    }, 1000);
  } else {
    btn.disabled = false; btn.textContent = '🎁 دریافت جایزه';
  }

  btn.onclick = async ()=>{
    btn.innerHTML = '<span class="spin"></span>'; btn.disabled = true;
    const { error } = await sb.rpc('claim_challenge', { p_user_id: state.user.id, p_completion_id: compId });
    if(error){ toast(error.message,'err'); btn.disabled=false; btn.textContent='دوباره تلاش کن'; return; }
    toast('سکه دریافت شد 🎉'); closeSheet();
    await refreshProfile(); renderTopActions(); render();
  };
}

const completionMap = {}; // challengeId -> completionId
async function handleChallengeClick(btn){
  if(!state.user){ nav('login'); return; }
  const chId = btn.dataset.ch;
  const wait = parseInt(btn.dataset.wait||'0');
  const url = btn.dataset.url;

  if(state.profile?.restricted_until && new Date(state.profile.restricted_until) > new Date()){
    toast('به‌دلیل فعالیت غیرعادی، فعلاً محدود شدی. کمی بعد دوباره امتحان کن','err');
    return;
  }

  if(btn.dataset.stage === 'ready'){
    btn.innerHTML = '<span class="spin"></span>'; btn.disabled = true;
    const { data, error } = await sb.rpc('claim_challenge', { p_user_id: state.user.id, p_completion_id: completionMap[chId] });
    if(error){ toast(error.message,'err'); btn.disabled=false; btn.textContent='دوباره تلاش کن'; await refreshProfile(); return; }
    flyCoin(btn.textContent.match(/\d+/)?.[0]||'', btn);
    toast('سکه دریافت شد 🎉');
    btn.textContent = 'دریافت شد ✅'; btn.classList.remove('btn-gold'); btn.classList.add('btn-ghost'); btn.disabled = true;
    await refreshProfile(); renderTopActions();
    return;
  }

  if(url){ window.open(url, '_blank'); }

  btn.innerHTML = '<span class="spin"></span>'; btn.disabled = true;
  const { data: compId, error } = await sb.rpc('start_challenge', { p_user_id: state.user.id, p_challenge_id: chId });
  if(error){ toast(error.message,'err'); btn.disabled=false; btn.textContent='انجام'; await refreshProfile(); return; }
  completionMap[chId] = compId;

  if(wait > 0){
    let remaining = wait;
    btn.disabled = true;
    const timer = setInterval(()=>{
      remaining--;
      btn.textContent = `⏳ ${remaining} ثانیه`;
      if(remaining<=0){
        clearInterval(timer);
        btn.dataset.stage = 'ready'; btn.disabled = false; btn.textContent = 'دریافت جایزه';
      }
    }, 1000);

function deriveStatus(e){
  const now = new Date(), s = new Date(e.start_date), en = new Date(e.end_date);
  if(now<s) return 'soon'; if(now>en) return 'end'; return 'live';
}
function eventCardHtml(e){
  const st = deriveStatus(e);
  const badge = st==='live' ? '<span class="badge badge-live">🟢 فعال</span>' : st==='soon' ? '<span class="badge badge-soon">🟡 به‌زودی</span>' : '<span class="badge badge-end">🔴 پایان‌یافته</span>';
  return `<div class="item" style="cursor:pointer" onclick="openEvent('${e.id}')">
    <div class="ico">${e.cover_emoji||'🎉'}</div>
    <div class="body"><div class="title">${e.name}</div><div class="desc">${(e.description||'').slice(0,60)}</div></div>
    ${badge}
  </div>`;
}
async function openEvent(id){
  const { data } = await sb.from('events').select('*').eq('id', id).single();
  if(!data) return;
  const { count } = await sb.from('event_participants').select('*',{count:'exact', head:true}).eq('event_id', id);
  const st = deriveStatus(data);
  openSheet(`${data.cover_emoji||'🎉'} ${data.name}`, `
    <p style="color:var(--sub); font-size:13.5px; line-height:2">${data.description||''}</p>
    <div class="field"><label>🎁 جایزه</label><div class="card">${data.reward||'—'}</div></div>

    <div class="grid2">

      <div class="card" style="text-align:center"><b>${new Date(data.end_date).toLocaleDateString('fa-IR')}</b><div style="color:var(--sub); font-size:11.5px">📅 پایان</div></div>
    </div>
    <button class="btn btn-gold btn-block" style="margin-top:16px" ${st!=='live'?'disabled':''} onclick="joinEvent('${data.id}')">${st==='live'?'شرکت در ایونت':st==='soon'?'به‌زودی شروع می‌شود':'ایونت پایان یافته'}</button>

async function submitOrder(){
  const btn = document.getElementById('submitOrderBtn');
  const fileInput = document.getElementById('receiptFile');
  const note = document.getElementById('trackingNote').value.trim();
  btn.innerHTML = '<span class="spin"></span>'; btn.disabled = true;

  let receiptUrl = null;
  if(fileInput.files && fileInput.files[0]){
    const file = fileInput.files[0];
    const path = `${state.user.id}/${Date.now()}-${file.name}`;
    const { error: upErr } = await sb.storage.from('receipts').upload(path, file);
    if(upErr){ toast('خطا در آپلود رسید: ' + upErr.message,'err'); btn.disabled=false; btn.textContent='ثبت سفارش'; return; }
    const { data: pub } = sb.storage.from('receipts').getPublicUrl(path);
    receiptUrl = pub.publicUrl;
  }

  const { error } = await sb.rpc('create_order', {
    p_user_id: state.user.id, p_order_type: pendingPurchase.type, p_ref_id: pendingPurchase.refId,
    p_label: pendingPurchase.label, p_price: pendingPurchase.price, p_receipt_url: receiptUrl, p_tracking_note: note
  });
  btn.disabled=false; btn.textContent='ثبت سفارش';
  if(error){ toast(error.message,'err'); return; }
  toast('سفارش ثبت شد. در انتظار بررسی ادمین ⏳');
  closeSheet();
}

let clickBusy = false;
async function doClick(){
  if(clickBusy) return;
  clickBusy = true;
  const btn = document.getElementById('clickerBtn');
  btn.style.transform = 'scale(.9)'; setTimeout(()=>btn.style.transform='scale(1)', 90);
  const { data, error } = await sb.rpc('clicker_tap', { p_user_id: state.user.id });
  clickBusy = false;
  if(error){ if(error.message && !error.message.includes('آروم')) toast(error.message,'err'); return; }
  const r = data[0];
  if(r.coins_awarded > 0){ flyCoin(r.coins_awarded, btn); }
  document.getElementById('clickCount').textContent = fmtNum(r.clicks_today);
  document.getElementById('clickMax').textContent = fmtNum(r.max_per_day);
  document.getElementById('clickProgressLabel').textContent = `${fmtNum(r.progress)} / ${fmtNum(r.taps_per_coin)}`;
  document.getElementById('clickProgressBar').style.width = Math.round((r.progress / r.taps_per_coin) * 100) + '%';
  refreshProfile().then(renderTopActions);
}

/* ---------------- QUEST CHAINS ---------------- */
async function renderQuests(){
  const app = document.getElementById('app');
  app.innerHTML = `<div class="section-title"><h2>🧩 ماموریت‌های زنجیره‌ای</h2><span>به ترتیب کامل کن</span></div>
  <div id="questsList"><div class="skel"></div><div class="skel"></div></div>`;
  const { data, error } = await sb.rpc('get_quest_chains', { p_user_id: state.user.id });
  const box = document.getElementById('questsList');
  if(error){ box.innerHTML = emptyHtml('خطا در دریافت ماموریت‌ها'); return; }
  box.innerHTML = (data&&data.length) ? data.map(questChainHtml).join('') : emptyHtml('فعلاً ماموریتی تعریف نشده');
}
function questChainHtml(c){
  const pct = c.total_steps > 0 ? Math.round((c.current_step / c.total_steps) * 100) : 0;
  let actionHtml;
  if(c.completed){
    actionHtml = `<span class="badge badge-ok">✅ تکمیل شد</span>`;
  } else if(c.next_step_order){
    actionHtml = `<button class="btn btn-gold btn-sm" onclick="doClaimQuestStep('${c.chain_id}')">مرحله ${c.next_step_order}: ${c.next_step_title} (+${fmtNum(c.next_step_reward)} 🪙)</button>`;
  } else {
    actionHtml = `<span class="muted" style="color:var(--sub); font-size:12px">به‌زودی مرحله‌ی بعد اضافه میشه</span>`;
  }
  return `<div class="card" style="margin-bottom:12px">
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px">
      <div class="ico" style="width:40px; height:40px; border-radius:12px; background:rgba(240,180,41,.13); display:flex; align-items:center; justify-content:center; font-size:19px">${c.icon||'🧩'}</div>
      <div style="flex:1"><div style="font-weight:800; font-size:14px">${c.title}</div><div class="muted" style="color:var(--sub); font-size:11.5px">${c.description||''}</div></div>
    </div>
    <div class="progress" style="margin-bottom:6px"><i style="width:${pct}%"></i></div>
    <div style="display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--sub); margin-bottom:10px">
      <span>${c.current_step} از ${c.total_steps} مرحله</span><span>🎁 جایزه‌ی پایانی: ${fmtNum(c.bonus_coins)} 🪙</span>
    </div>
    ${actionHtml}
  </div>`;
}
async function doClaimQuestStep(chainId){
  const { data, error } = await sb.rpc('claim_quest_step', { p_user_id: state.user.id, p_chain_id: chainId });
  if(error){ toast(error.message,'err'); return; }
  const r = data[0];
  flyCoin(r.reward);
  toast(r.chain_completed ? `🎉 زنجیره تکمیل شد! +${fmtNum(r.reward + r.bonus_awarded)} سکه` : `مرحله ${r.step_order} کامل شد! +${fmtNum(r.reward)} سکه`);
  await refreshProfile(); renderTopActions();
  renderQuests();
}
function openSheet(title, bodyHtml){
  const ov = document.createElement('div');
  ov.className='overlay'; ov.id='sheetOverlay';
  ov.onclick = (e)=>{ if(e.target===ov) closeSheet(); };
  ov.innerHTML = `<div class="sheet"><div class="sheet-head"><h3>${title}</h3><div class="close-x" onclick="closeSheet()">✕</div></div>${bodyHtml}</div>`;
  document.body.appendChild(ov);
}
function closeSheet(){ document.getElementById('sheetOverlay')?.remove(); }
</script>
